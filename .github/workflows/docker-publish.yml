name: Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm build

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and load test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: storage-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check runtime and excluded private files
        run: node scripts/check-container.cjs storage-smoke:ci
      - name: Check portable Compose deployment
        run: node scripts/check-compose.cjs storage-smoke:ci
      - name: Read release version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: version
        run: node -e "const fs=require('node:fs');const {version}=require('./package.json');fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version='+version+'\n')"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cimorn/storage
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},priority=1000
            type=raw,value=latest,priority=100
      - name: Publish multi-platform image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
