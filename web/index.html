<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon.png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>物品管理</title>
    <style>
      body:has(.entry-page) { margin: 0; }
      .entry-page { min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #172026; background: #eef2f5; font: 400 16px/1.5 "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei UI", sans-serif; }
      .entry-page * { box-sizing: border-box; }
      .entry-card { display: grid; gap: 18px; width: min(100%, 400px); padding: 34px; background: rgba(255,255,255,.88); border: 1px solid rgba(33,47,57,.12); border-radius: 8px; box-shadow: 0 24px 54px rgba(23,32,38,.14); }
      .entry-card h1 { margin: 0; font-size: 28px; }
      .entry-field { display: grid; gap: 6px; }
      .entry-field span { color: #64717d; font-size: .76rem; font-weight: 800; }
      .entry-field input { width: 100%; padding: 10px 11px; color: #172026; background: #fff; border: 1px solid rgba(33,47,57,.12); border-radius: 8px; outline: none; font: inherit; }
      .entry-field input:focus { border-color: rgba(15,118,110,.46); box-shadow: 0 0 0 4px rgba(15,118,110,.08); }
      .entry-card button { min-height: 34px; padding: 7px 13px; color: #fff; background: #0f766e; border: 0; border-radius: 8px; font: inherit; font-size: .82rem; font-weight: 700; cursor: pointer; box-shadow: 0 10px 18px rgba(15,118,110,.22); }
      .entry-card button:disabled { opacity: .52; cursor: not-allowed; box-shadow: none; }
      .entry-card [data-entry-retry] { color: #64717d; background: transparent; box-shadow: none; }
      .entry-card [role=alert] { color: #b42318; }
      .entry-card [hidden] { display: none; }
    </style>
    <script type="module" src="/src/renderer/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <main class="entry-page">
        <form class="entry-card" method="post" id="entry-login">
          <h1>物品管理</h1>
          <label class="entry-field"><span>访问密码</span><input id="entry-password" type="password" autocomplete="current-password" autofocus required /></label>
          <p data-entry-feedback role="status" aria-live="polite" hidden></p>
          <button type="submit" disabled>登录</button>
          <button type="button" data-entry-retry hidden>重试</button>
          <noscript>请启用 JavaScript 后登录。</noscript>
        </form>
      </main>
    </div>
  </body>
  </html>
